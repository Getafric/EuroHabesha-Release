workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - eurohabesha-distribution-2026
        provisioning_profiles:
          - eurohabesha123

    integrations:
      app_store_connect: codemagic-eurohabesha-new-2

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Check signing configuration
        script: |
          echo "=== EXPORT OPTIONS ==="
          cat /Users/builder/export_options.plist || true
          echo "=== SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning
        script: |
          flutter pub get

      - name: Inspect signing assets
        script: |
          echo "Codesigning identities:"
          security find-identity -v -p codesigning
          echo "Provisioning profiles:"
          ls -lah ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
