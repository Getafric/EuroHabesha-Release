name: Build and Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'

      - name: Debug commit and pubspec
        run: |
          echo "Commit:"
          git rev-parse --short HEAD
          echo "pubspec SDK + flutter_lints:"
          grep -nE "^environment:|^  sdk:|flutter_lints" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No codesign for initial check)
        run: flutter build ios --release --no-codesign
