name: euro_habesha
description: "A new Flutter project."
publish_to: 'none'

version: 2.1.1+100

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8

  # ── Firebase & Auth ──
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.6.0
  google_sign_in: ^6.3.0

  # ── Notifications & Messaging (ኖቲፊኬሽን) ──
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.2.4

  # ── Location & Maps (ጂፒኤስ እና ካርታ) ──
  geolocator: ^14.0.3

  # ── Utilities, Media & Scanner (ካሜራ፣ ሊንክ እና ፎቶዎች) ──
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  file_selector: ^1.0.3
  cached_network_image: ^3.4.1  
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.3

  # ── Monetization & Ads (ማስታወቂያ እና ክፍያ) ──
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^9.0.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  in_app_review: ^2.0.12
  pdf: ^3.13.1
  printing: ^5.15.1
  audioplayers: ^6.8.1
  cloud_functions: ^6.5.0
  flutter_stripe: ^14.1.0
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/sounds/
# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/euro_habesha_logo.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/images/euro_habesha_logo.png"
  adaptive_icon_background: "#061E12"

# ── Splash Screen Configuration ──
flutter_native_splash:
  color: "#061E12"
  image: "assets/images/euro_habesha_logo.png"
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#061E12"
    image: "assets/images/euro_habesha_logo.png"
    icon_background_color: "#061E12"
  ios: true
  android: true
