workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getafric.eurohabesha

    integrations:
      app_store_connect: codemagic-eurohabesha-new

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist="$HOME/export_options.plist"

      - name: Normalize IPA artifact
        script: |
          set -e
          mkdir -p build/ios/ipa
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -print
          IPA_PATH="$(find "$CM_BUILD_DIR" -type f -name "*.ipa" | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA file was produced by the build."
            exit 1
          fi
          cp "$IPA_PATH" "build/ios/ipa/Runner.ipa"
          ls -lah build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
