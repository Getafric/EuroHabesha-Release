workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android App Bundle (AAB)
        script: |
          UNIQUE_BUILD_NUMBER=$(date +%s)
          flutter build appbundle --release --build-name="2.1.1" --build-number=$UNIQUE_BUILD_NUMBER

      - name: Build Android APK
        script: |
          UNIQUE_BUILD_NUMBER=$(date +%s)
          flutter build apk --release --build-name="2.1.1" --build-number=$UNIQUE_BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        certificates:
          - eurohabesha-distribution-2026
        provisioning_profiles:
          - eurohabesha-appstore-final-2026

    integrations:
      app_store_connect: codemagic-eurohabesha-new-2

    scripts:
      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Apply signing profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          UNIQUE_BUILD_NUMBER=$(date +%s)
          flutter build ipa --release --build-name="2.1.1" --build-number=$UNIQUE_BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
