workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.getafric.eurohabesha

    integrations:
      app_store_connect: codemagic-eurohabesha-new

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Inspect signing assets
        script: |
          echo "Codesigning identities:"
          security find-identity -v -p codesigning
          echo "Provisioning profiles:"
          ls -lah ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Build iOS IPA
        script: |
          set -eo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ios/archive" "$EXPORT_PATH" /tmp/xcodebuild_logs
          echo "Export options plist:"
          cat "$HOME/export_options.plist"
          if ! xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            | tee /tmp/xcodebuild_logs/archive.log; then
            echo "Archive failed. Last xcodebuild lines:"
            tail -n 200 /tmp/xcodebuild_logs/archive.log || true
            exit 1
          fi
          if ! xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            | tee /tmp/xcodebuild_logs/export.log; then
            echo "Export failed. Last xcodebuild lines:"
            tail -n 200 /tmp/xcodebuild_logs/export.log || true
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
