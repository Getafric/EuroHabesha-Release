workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - eurohabesha123
        provisioning_profiles:
          - eurohabesha123

    integrations:
      app_store_connect: codemagic-eurohabesha-new

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Inspect signing assets
        script: |
          echo "Codesigning identities:"
          security find-identity -v -p codesigning
          echo "Provisioning profiles:"
          ls -lah ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Build iOS IPA
        script: |
          set -eo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"
          EXPORT_OPTIONS="/tmp/export_options_custom.plist"
          mkdir -p "$CM_BUILD_DIR/build/ios/archive" "$EXPORT_PATH" /tmp/xcodebuild_logs

          PROFILE_NAME=""
          PROFILE_UUID=""
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$profile" ] || continue
            decoded="/tmp/decoded_profile.plist"
            security cms -D -i "$profile" > "$decoded" 2>/dev/null || continue
            app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$decoded" 2>/dev/null || true)
            if [[ "$app_id" == *".com.getafric.eurohabesha" ]]; then
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$decoded" 2>/dev/null || true)
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$decoded" 2>/dev/null || true)
              break
            fi
          done
          if [ -z "$PROFILE_NAME" ] || [ -z "$PROFILE_UUID" ]; then
            echo "No provisioning profile found for com.getafric.eurohabesha"
            ls -lah ~/Library/MobileDevice/Provisioning\ Profiles || true
            exit 1
          fi
          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>ZX6L64MH6M</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.getafric.eurohabesha</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

          if ! xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            archive \
            | tee /tmp/xcodebuild_logs/archive.log; then
            echo "Archive failed. Last xcodebuild lines:"
            tail -n 250 /tmp/xcodebuild_logs/archive.log || true
            exit 1
          fi

          if ! xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            | tee /tmp/xcodebuild_logs/export.log; then
            echo "Export failed. Last xcodebuild lines:"
            tail -n 250 /tmp/xcodebuild_logs/export.log || true
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
