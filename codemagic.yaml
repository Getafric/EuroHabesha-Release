workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - eurohabesha123
        provisioning_profiles:
          - eurohabesha_appstore_only

    integrations:
      app_store_connect: codemagic-eurohabesha-new

    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Inspect signing assets
        script: |
          echo "Codesigning identities:"
          security find-identity -v -p codesigning
          echo "Provisioning profiles:"
          ls -lah ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Build iOS IPA
        script: |
          set -e
          if ! xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner; then
            echo "xcode-project build-ipa failed. Dumping xcodebuild logs..."
            find /tmp/xcodebuild_logs -maxdepth 1 -type f -name "*.log" -print -exec tail -n 250 {} \;
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - getafricshow1@gmail.com
        notify:
          success: true
          failure: true
